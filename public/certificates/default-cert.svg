<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141e"/>
      <stop offset="50%" stop-color="#0e0e14"/>
      <stop offset="100%" stop-color="#08080c"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a2a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff2a2a" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a2a"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="560" fill="url(#bg)"/>
  <rect x="20" y="20" width="760" height="520" rx="20" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2"/>
  <rect x="36" y="36" width="728" height="488" rx="14" fill="url(#redGlow)" stroke="rgba(255, 42, 42, 0.25)" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Corner Accents -->
  <path d="M 46 76 L 46 46 L 76 46" fill="none" stroke="#ff2a2a" stroke-width="3"/>
  <path d="M 754 76 L 754 46 L 724 46" fill="none" stroke="#ff2a2a" stroke-width="3"/>
  <path d="M 46 484 L 46 514 L 76 514" fill="none" stroke="#ff2a2a" stroke-width="3"/>
  <path d="M 754 484 L 754 514 L 724 514" fill="none" stroke="#ff2a2a" stroke-width="3"/>

  <!-- Central Seal Icon -->
  <g transform="translate(400, 230)">
    <circle r="60" fill="#181824" stroke="url(#accent)" stroke-width="3"/>
    <circle r="48" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" stroke-dasharray="4 3"/>
    <!-- Ribbon tails -->
    <path d="M -24 44 L -34 94 L -10 80 L 14 94 L 4 44" fill="#a01818" opacity="0.8"/>
    <path d="M -12 48 L -20 84 L 0 74 L 20 84 L 12 48" fill="#ff2a2a" opacity="0.9"/>
    <!-- Award Star / Emblem -->
    <polygon points="0,-28 8,-8 30,-8 12,6 18,28 0,14 -18,28 -12,6 -30,-8 -8,-8" fill="url(#accent)"/>
  </g>

  <!-- Typography -->
  <text x="400" y="360" font-family="monospace, sans-serif" font-size="14" font-weight="bold" letter-spacing="4" fill="#ff2a2a" text-anchor="middle">VERIFIED CREDENTIAL</text>
  <text x="400" y="400" font-family="sans-serif" font-size="24" font-weight="900" letter-spacing="2" fill="#ffffff" text-anchor="middle">CERTIFICATE OF ACHIEVEMENT</text>
  <text x="400" y="434" font-family="monospace, sans-serif" font-size="12" letter-spacing="1.5" fill="rgba(255, 255, 255, 0.5)" text-anchor="middle">ACCREDITED TECHNICAL PROFICIENCY</text>
</svg>
